name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  releases: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ gitea.ref_name }}
      GITEA_REPOSITORY: ${{ gitea.repository }}
      GITEA_SERVER_URL: ${{ gitea.server_url }}
      GITEA_SERVER_TOKEN: ${{ secrets.GITEA_TOKEN }}
      XDG_CONFIG_HOME: ${{ gitea.workspace }}/.tea-config

    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate runner tools
        shell: bash
        run: |
          command -v tea
          command -v zip
          command -v sha256sum

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected SemVer format: v0.0.1"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Extract release notes
        shell: bash
        run: |
          awk -v heading="## [$TAG]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no release notes for $TAG"
            exit 1
          fi

      - name: Build Windows package
        shell: bash
        run: |
          package="eris-${TAG}-windows-amd64"
          package_dir="dist/${package}"

          mkdir -p "$package_dir"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w -X github.com/ylanzinhoy/eris/cmd.Version=${TAG}" \
            -o "${package_dir}/eris.exe" \
            .

          cp games.json README.md CHANGELOG.md "$package_dir/"

          (
            cd dist
            zip -qr "${package}.zip" "$package"
            sha256sum "${package}.zip" > "${package}.zip.sha256"
          )

      - name: Publish Gitea release
        shell: bash
        run: |
          package="eris-${TAG}-windows-amd64"

          tea login add \
            --name ci \
            --url "$GITEA_SERVER_URL" \
            --no-version-check

          tea releases create "$TAG" \
            --login ci \
            --repo "$GITEA_REPOSITORY" \
            --title "Éris $TAG" \
            --note-file release-notes.md \
            --asset "dist/${package}.zip" \
            --asset "dist/${package}.zip.sha256"
